[project]
name = "reconciliation-pennylane"
version = "0.1.0"
description = "Automatisation du rapprochement bancaire Qonto -> Pennylane (détection des dépenses sans justificatif, import et matching de factures)."
requires-python = ">=3.9"
# Cœur volontairement SANS dépendance : tout tourne avec la stdlib (urllib, json, csv,
# difflib). `python3 scripts/backlog_report.py` fonctionne sans `pip install`.
dependencies = []

[project.optional-dependencies]
# Optionnel : améliore la qualité du regroupement fuzzy (sinon fallback difflib).
fuzzy = ["rapidfuzz>=3.0"]
# Optionnel : automatisation du portail UberEats (téléchargement des factures).
# Installer le navigateur après : playwright install chromium
portal = ["playwright>=1.40"]
# Optionnel : rapprochement factures fournisseurs depuis Google Drive.
drive = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
